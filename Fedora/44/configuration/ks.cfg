url --mirrorlist="https://mirrors.fedoraproject.org/mirrorlist?repo=fedora-44&arch=aarch64"
repo --name=fedora-updates --mirrorlist="https://mirrors.fedoraproject.org/mirrorlist?repo=updates-released-f44&arch=aarch64" --cost=0

lang en_US.UTF-8
keyboard --xlayouts='us'
timezone Europe/Berlin
skipx

network --bootproto=dhcp --noipv6 --onboot=on --device=eth0
rootpw --plaintext vagrant
user --name=vagrant --groups=wheel --plaintext --password vagrant
sshkey --username=vagrant "ssh-rsa  vagrant insecure public key"
firewall --disabled
selinux --disabled

zerombr
clearpart --all --initlabel
autopart --nohome --nolvm --noboot
# suppress predictable network interface names via append="net.ifnames=0 biosdevname=0"
bootloader --timeout=1 --location=mbr --append="net.ifnames=0 biosdevname=0"
firstboot --disabled
reboot --eject

%packages --ignoremissing --excludedocs --exclude-weakdeps
ansible
bash-completion
bzip2
curl
cri-o1.37
cri-tools1.37
containernetworking-plugins
git
gpg
helm
iptables
iproute-tc
jq
kubernetes1.37
kubernetes1.37-kubeadm
kubernetes1.37-client
kustomize
openssh
tar
wget
-zram-generator-defaults
-linux-firmware
%end

%post
echo 'Defaults:vagrant !requiretty' > /etc/sudoers.d/vagrant
echo '%vagrant ALL=(ALL) NOPASSWD: ALL' >> /etc/sudoers.d/vagrant
chmod 440 /etc/sudoers.d/vagrant

# Add required sysctl parameters and persist
cat <<EOF > /etc/sysctl.d/k8s.conf
net.bridge.bridge-nf-call-ip6tables = 1
net.bridge.bridge-nf-call-iptables  = 1
net.ipv4.ip_forward                 = 1
EOF

# Configure IPv4 forwarding and bridge filters
cat <<EOF > /etc/modules-load.d/k8s.conf
overlay
br_netfilter
EOF

modprobe overlay
modprobe br_netfilter

# Disable systemd-resolved stub to fix CoreDNS CrashLoopBackOff
mkdir -pv /etc/systemd/resolved.conf.d
cat <<EOF > /etc/systemd/resolved.conf.d/stub-listener.conf
[Resolve]
DNSStubListener=no
EOF

cat <<EOF >> /home/vagrant/.bashrc
alias k=kubectl
export KUBECONFIG=~/.kube/conf
source <(kubectl completion bash | sed 's/kubectl/k/g')
EOF

# Pin the sandbox image to the one kubeadm 1.37 expects (pre-pulled by scripts/prepull.sh)
mkdir -pv /etc/crio/crio.conf.d
cat <<CONF > /etc/crio/crio.conf.d/10-mkube.conf
[crio.image]
pause_image = "registry.k8s.io/pause:3.10.2"
CONF

# CRI-O 1.34+ enforces short-name-mode; resolve unqualified image names against docker.io only
cat <<CONF > /etc/containers/registries.conf.d/99-mkube-unqualified-search.conf
unqualified-search-registries = ["docker.io"]
CONF

cat <<CONF > /etc/crictl.yaml
runtime-endpoint: unix:///run/crio/crio.sock
image-endpoint: unix:///run/crio/crio.sock
CONF

systemctl enable --now crio
systemctl enable --now kubelet
dnf versionlock add 'kubernetes1.37*' cri-o1.37 cri-tools1.37

%end
